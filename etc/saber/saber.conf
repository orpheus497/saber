# saber.conf -- configuration for saber(1), the Hikari Sakura panel.
#
# UCL, the same dialect and the same parser as hikari.conf, so one syntax
# covers the desktop.
#
# EVERY KEY IS OPTIONAL. This whole file may be deleted and Saber still starts
# with the values shown below, which are the defaults. Keys are written here
# with the values they already have, so uncommenting one changes nothing until
# you edit it.
#
# Copy it to ~/.config/saber/saber.conf to make it yours. Saber never rewrites
# this file, or yours.

panel {
  # Which outputs carry a panel: "all", "primary", or an output name as
  # reported by the compositor (e.g. "eDP-1").
  output = "all"

  # Which screen edge. The panel anchors to the full height of the usable
  # area, so it sits underneath the compositor's top bar automatically --
  # there is no offset to configure and none to get wrong.
  edge = left

  # Icon edge length in logical pixels, 24-64. The tile is this plus 12, so
  # the default 32 gives a 44px column. 32 and 48 are sizes every icon theme
  # ships natively; values between them make raster icons resample.
  icon-size = 32

  # "never" reserves the strip and windows tile around it.
  # "auto" reserves nothing and reveals on edge pressure.
  #
  # There is no "dodge". Hiding only when a window would overlap needs window
  # geometry, and no foreign-toplevel protocol publishes any. See saber(1),
  # KNOWN LIMITS.
  autohide = never

  # How hard you must push into the screen edge before an autohidden panel
  # slides out. Higher is harder. Ignored when autohide = never.
  reveal-pressure = 240

  # Animation duration. 0 disables animation entirely -- tiles snap, the panel
  # appears without sliding, nothing throbs.
  animation-ms = 180
}

theme {
  # Read ui { palette } out of your hikari.conf, so retheming the compositor
  # retints the panel with it -- the same contract the compositor already has
  # with its top bar and its lock screen. Drop a terminal colour scheme into
  # hikari.conf and the whole desktop follows.
  #
  # Set false, or supply a palette block below, to break that link.
  inherit-hikari = true

  # An explicit palette overrides the import. All sixteen slots are required:
  # a partial palette is reported and ignored rather than tinting half the
  # panel. Conventional terminal layout, 0-7 normal and 8-15 bright.
  #
  # palette {
  #   color0  = "#2b1e3a"
  #   ...
  #   color15 = "#f0edf2"
  # }

  # The tile fill behind a running application's icon.
  #   palette   a palette colour, consistent with the rest of the desktop
  #   dominant  tinted from the icon, as Unity did
  #   off       no fill
  backlight = palette

  # Opacity of the column itself. Applies to the panel background and the
  # dash/spread backdrop, not to icons or text.
  opacity = 0.92
}

launcher {
  # Desktop-file IDs, in order, pinned to the launcher.
  #
  # This SEEDS the list on first run only. The live order -- the one you get
  # by dragging tiles -- lives in $XDG_DATA_HOME/saber/favourites and wins
  # from then on. Delete that file to seed from here again.
  favourites = [
    "sofi.desktop",
    "firefox.desktop",
  ]
}

# Which items the column carries, top to bottom. Each may be turned off
# individually; a feature compiled out with a WITH_* switch is absent whatever
# is written here.
items {
  bfb     = true   # application menu button at the top
  sheets  = true   # current sheet, with a ten-cell switcher on click
  devices = true   # mounted removable volumes
  trash   = true
  tray    = true   # StatusNotifierItem host
  session = true   # suspend, reboot, shut down
}

session {
  # An EMPTY string means "use the built-in command" for the three power
  # actions. The built-ins rely on membership of FreeBSD's operator group,
  # which already owns /sbin/shutdown (setuid root, group-executable) and
  # /dev/acpi (group-writable):
  #
  #   suspend    acpiconf -s3
  #   reboot     shutdown -r now      (never /sbin/reboot, which is not setuid)
  #   poweroff   shutdown -p now
  #
  # Saber installs nothing setuid or setgid and writes no sudoers rule. If you
  # are not in the group, an administrator runs:
  #
  #   pw groupmod operator -m <user>
  #
  # Without it Saber HIDES these entries rather than offering buttons that
  # fail. Set a string here only to override -- e.g. "sudo shutdown -p now" on
  # a host that deliberately keeps its users out of operator.
  suspend  = ""
  reboot   = ""
  poweroff = ""

  # For these two an empty string means HIDE THE ENTRY, because there is
  # nothing to run: the compositor exposes no lock verb and FreeBSD has no
  # logind. Point them at whatever you use and they appear.
  lock   = ""
  logout = ""
}
